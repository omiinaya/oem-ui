name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows a manual re-deploy without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Served from the GitHub Pages fallback URL
      # (omiinaya.github.io/oem-ui/), so a path prefix applies. If a custom
      # domain ever goes live it is served from its own root and both values
      # become SITE_URL=<domain> and SITE_BASE=/ — change them as a pair.
      - name: Build
        env:
          SITE_URL: https://omiinaya.github.io
          SITE_BASE: /oem-ui/
        run: npm run build

      # AFTER the build, not before: the copy-button contract tests read the
      # BUILT dist/index.html, because the thing they assert (a rendered code
      # block, its id, and the button wired to it) only exists after a
      # compile. Running them first fails on a clean checkout with
      # "dist/index.html is missing", which is a test-harness error that reads
      # like a broken library.
      - name: Contract tests
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, pve-scripts]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
