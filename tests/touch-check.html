<!doctype html>
<!-- Dev-only: emulates a TOUCH device (coarse pointer, hover:none) at phone
     widths, because a desktop browser reports a fine pointer and the
     @media (pointer: coarse) rules would otherwise never be exercised. -->
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>cli-mono — touch emulation</title>
		<style>
			html { background: #050505; color: #e8e8e8; font-family: ui-monospace, monospace; margin: 0; }
			body { margin: 0; padding: 18px; }
			.dev-label { font-size: 12px; color: #8b8b8b; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 6px; }
			iframe { display: block; border: 1px solid #2a2a2a; background: #0a0a0a; margin-bottom: 26px; }
		</style>
	</head>
	<body>
		<p class="dev-label">375 · touch</p>
		<iframe src="./index.html" width="375" height="760"></iframe>
		<p class="dev-label">390 · touch</p>
		<iframe src="./index.html" width="390" height="760"></iframe>
	</body>
</html>
